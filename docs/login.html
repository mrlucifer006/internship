<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSBS Login Portal - Visitor & Logistics System</title>
    <link rel="icon" href="./assets/images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="bg-slate-50 font-sans antialiased min-h-screen flex flex-col justify-center items-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200/80 p-8 sm:p-10 animate-modal">
        <!-- Logo & Header -->
        <div class="flex flex-col items-center gap-3 mb-6">
            <div class="size-16 rounded-2xl bg-indigo-50 border border-indigo-100 flex items-center justify-center shadow-md p-2">
                <img src="./assets/images/favicon.ico" alt="SSBS Logo" class="size-10 object-contain">
            </div>
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">SSBS Login Portal</h1>
            <p class="text-slate-500 text-sm text-center">Secure Gate, Logistics & Visitor Management</p>
        </div>

        <!-- Alert Banner -->
        <div id="login-alert" class="hidden mb-5 p-3.5 rounded-xl text-sm font-medium animate-fade-in"></div>

        <!-- Form -->
        <form id="login-form" class="flex flex-col gap-4">
            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Username</label>
                <div class="relative flex items-center">
                    <span class="absolute left-3.5 text-slate-400 material-symbols-outlined text-[20px]">person</span>
                    <input type="text" id="username" name="username" required autocomplete="username"
                        class="w-full rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 h-11 pl-11 pr-4 text-sm text-slate-800 transition-all placeholder:text-slate-400"
                        placeholder="e.g. super, admin">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                <div class="relative flex items-center">
                    <span class="absolute left-3.5 text-slate-400 material-symbols-outlined text-[20px]">lock</span>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="w-full rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 h-11 pl-11 pr-11 text-sm text-slate-800 transition-all placeholder:text-slate-400"
                        placeholder="••••••••">
                    <button type="button" onclick="togglePassVisibility()" class="absolute right-3.5 text-slate-400 hover:text-slate-600">
                        <span id="pass-eye-icon" class="material-symbols-outlined text-[20px]">visibility</span>
                    </button>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-[#1e73be] hover:bg-blue-700 active:scale-[0.98] text-white font-bold h-12 rounded-xl transition-all shadow-md shadow-blue-200 mt-2 flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-xl">login</span>
                Sign In to System
            </button>
        </form>

        <!-- Quick Demo Profiles Switcher -->
        <div class="mt-8 pt-6 border-t border-slate-100">
            <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-3 text-center">Quick Demo Login (Select Role):</p>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="quickFill('super', 'password123')"
                    class="px-2.5 py-2 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-lg text-xs font-semibold text-indigo-700 text-left transition-colors flex items-center justify-between">
                    <span>Developer (L5)</span>
                    <span class="text-[10px] text-indigo-400 font-mono">super</span>
                </button>
                <button type="button" onclick="quickFill('admin', 'password123')"
                    class="px-2.5 py-2 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-lg text-xs font-semibold text-emerald-700 text-left transition-colors flex items-center justify-between">
                    <span>Admin (L4)</span>
                    <span class="text-[10px] text-emerald-400 font-mono">admin</span>
                </button>
                <button type="button" onclick="quickFill('supervisor1', 'password123')"
                    class="px-2.5 py-2 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-lg text-xs font-semibold text-amber-700 text-left transition-colors flex items-center justify-between">
                    <span>Supervisor (L2)</span>
                    <span class="text-[10px] text-amber-400 font-mono">supervisor</span>
                </button>
                <button type="button" onclick="quickFill('foreman1', 'password123')"
                    class="px-2.5 py-2 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-lg text-xs font-semibold text-blue-700 text-left transition-colors flex items-center justify-between">
                    <span>Foreman (L1)</span>
                    <span class="text-[10px] text-blue-400 font-mono">foreman</span>
                </button>
            </div>
        </div>

        <div class="mt-6 text-center text-xs text-slate-400">
            SSBS Industrial Security & Gate Management System
        </div>
    </div>

    <script src="./assets/js/db.js"></script>
    <script src="./assets/js/app.js"></script>
    <script>
        function togglePassVisibility() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('pass-eye-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        function quickFill(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            document.getElementById('login-form').requestSubmit();
        }

        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('login-alert');

            const res = window.SSBS_DB.login(username, password);
            if (res.success) {
                alertBox.className = 'mb-5 p-3.5 rounded-xl text-sm font-medium animate-fade-in bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center gap-2';
                alertBox.innerHTML = '<span class="material-symbols-outlined text-base">check_circle</span> Login successful! Redirecting...';
                alertBox.classList.remove('hidden');
                setTimeout(() => {
                    window.location.href = './index.html';
                }, 400);
            } else {
                alertBox.className = 'mb-5 p-3.5 rounded-xl text-sm font-medium animate-fade-in bg-red-50 text-red-700 border border-red-200 flex items-center gap-2';
                alertBox.innerHTML = `<span class="material-symbols-outlined text-base">error</span> ${res.message}`;
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
