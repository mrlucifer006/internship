<div id="whatsapp-qr-modal" class="fixed inset-0 bg-gray-900 bg-opacity-60 overflow-y-auto h-full w-full hidden z-50 backdrop-blur-sm">
    <div class="relative top-20 mx-auto p-6 border-none w-96 shadow-2xl rounded-2xl bg-white">
        <div class="mt-3 text-center">
            <h3 class="text-xl leading-6 font-bold text-gray-900">WhatsApp Login</h3>
            
            <div class="mt-2 px-4 py-3">
                <p class="text-sm text-gray-500 mb-6">
                    Scan the QR code with your phone to enable automated messaging.
                </p>
                
                <div id="qr-container" class="flex justify-center items-center">
                    <img id="qr-image" src="" alt="WhatsApp QR Code" class="w-64 h-64 hidden rounded-xl border shadow-sm">
                    
                    <div id="qr-placeholder" class="animate-pulse w-64 h-64 bg-gray-100 rounded-xl flex flex-col items-center justify-center border-2 border-dashed border-gray-200">
                        <div class="text-gray-400 text-sm font-medium">Generating QR...</div>
                    </div>
                </div>
            </div>

            <div class="px-4 py-4">
                <button id="close-qr-modal" class="px-4 py-3 bg-indigo-600 text-white text-sm font-semibold rounded-xl w-full shadow-md hover:bg-indigo-700 active:scale-95 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                    Dismiss for Now
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('whatsapp-qr-modal');
        const qrImage = document.getElementById('qr-image');
        const qrPlaceholder = document.getElementById('qr-placeholder');
        const closeBtn = document.getElementById('close-qr-modal');
        
        let isModalDismissed = false;

        // Function to close/hide the modal
        closeBtn.onclick = function() {
            modal.classList.add('hidden');
            isModalDismissed = true;
        }

        function checkWhatsAppStatus() {
            fetch('/get_whatsapp_qr')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    // If the backend reports we are connected, hide the modal
                    if (data.connected) {
                        modal.classList.add('hidden');
                        isModalDismissed = false; // Reset for future sessions
                    } 
                    // If not connected and we have a QR code, show the modal (unless dismissed)
                    else if (data.qr && !isModalDismissed) {
                         modal.classList.remove('hidden');
                         qrImage.src = "data:image/png;base64," + data.qr;
                         qrImage.classList.remove('hidden');
                         qrPlaceholder.classList.add('hidden');
                    }
                })
                .catch(err => console.error("Error fetching QR status:", err));
        }

        // Poll the server every 3 seconds for status updates
        setInterval(checkWhatsAppStatus, 3000);
        
        // Initial check on page load
        checkWhatsAppStatus();
    });
</script>
