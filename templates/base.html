<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My App{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% block head %}{% endblock %}
</head>

<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <nav class="bg-blue-600 p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-white text-lg font-bold">MyApp</a>
            <div>
                {% if session.user %}
                <form action="{{ url_for('sync_cache') }}" method="POST" class="inline">
                    <button type="submit" class="bg-blue-700 hover:bg-blue-800 text-white font-bold py-2 px-4 rounded">
                        Sync Cache
                    </button>
                </form>
                {% endif %}
                <!-- Add navigation links here if needed -->
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 mt-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 p-4 mt-8 text-white text-center">
        <p>&copy; 2024 My App. All rights reserved.</p>
    </footer>
    {% include 'whatsapp_qr.html' %}
</body>

</html>
