<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login - Gate Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { "primary": "#1e73be", "brand-green": "#5c8a42" },
                    fontFamily: { "display": ["Inter", "sans-serif"] },
                },
            },
        }
    </script>
</head>

<body class="bg-gray-50 font-display antialiased min-h-screen flex flex-col justify-center items-center">

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg border border-gray-100 p-8">
        <div class="flex flex-col items-center gap-4 mb-8">
            <div class="size-12 flex items-center justify-center text-[var(--brand-green)] bg-green-50 rounded-full">
                <span class="material-symbols-outlined text-4xl">security</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Gate Portal</h1>
            <p class="text-gray-500 text-sm">Please sign in to continue</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="mb-6 flex flex-col gap-2">
            {% for category, message in messages %}
            <div class="p-3 rounded-lg text-sm font-medium 
                        {% if category == 'error' %} bg-red-50 text-red-600 border border-red-100
                        {% else %} bg-blue-50 text-blue-600 border border-blue-100 {% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="flex flex-col gap-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" required
                    class="w-full rounded-lg border-gray-300 focus:border-primary focus:ring-primary h-11 px-4 text-base placeholder-gray-400"
                    placeholder="Enter username">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full rounded-lg border-gray-300 focus:border-primary focus:ring-primary h-11 px-4 text-base placeholder-gray-400"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full bg-[#1e73be] hover:bg-blue-700 text-white font-bold h-12 rounded-lg transition-colors shadow-sm mt-2">
                Sign In
            </button>
        </form>
    </div>

</body>

</html>
