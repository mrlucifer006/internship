<!-- Notification Sound -->
<audio id="notification-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"
    preload="auto"></audio>

<!-- Custom Notification Modal -->
<div id="custom-notification-modal" class="fixed inset-0 z-[100] hidden" aria-labelledby="modal-title" role="dialog"
    aria-modal="true" style="display: none;">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="snoozeNotification()"></div>

    <div class="fixed inset-0 z-10 overflow-y-auto">
        <div class="flex min-h-full items-center justify-center p-4">

            <div
                class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all w-full max-w-md border border-slate-100">

                <!-- Header -->
                <div class="bg-indigo-600 px-4 py-3 flex items-center justify-between">
                    <h3 class="text-base font-bold text-white flex items-center gap-2">
                        <span class="material-symbols-outlined text-sm">notifications_active</span>
                        Visitor Request
                    </h3>
                    <button onclick="snoozeNotification()" class="text-indigo-200 hover:text-white transition-colors">
                        <span class="material-symbols-outlined text-sm">close</span>
                    </button>
                </div>

                <!-- Main Content -->
                <div class="p-6">
                    <!-- Visitor Info Section -->
                    <div class="flex items-start gap-4 mb-6">
                        <div
                            class="size-12 rounded-full bg-indigo-50 flex items-center justify-center shrink-0 border border-indigo-100">
                            <span class="material-symbols-outlined text-indigo-600 text-2xl">person</span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-lg font-bold text-slate-900 truncate" id="modal-visitor-name">Visitor Name
                            </p>
                            <p class="text-sm text-slate-500 font-medium mt-0.5 break-words" id="modal-visitor-reason">
                                Reason for visit</p>
                        </div>
                    </div>

                    <hr class="border-slate-100 mb-6" />

                    <!-- VIEW: DEFAULT ACTIONS -->
                    <div id="view-default">
                        <p class="text-sm text-slate-500 mb-4 text-center">Select an action for this request:</p>
                        <div class="grid grid-cols-3 gap-3">
                            <button onclick="showView('deny')"
                                class="flex flex-col items-center justify-center gap-1 p-3 rounded-xl border border-red-100 bg-red-50 text-red-700 hover:bg-red-100 transition-all">
                                <span class="material-symbols-outlined">block</span>
                                <span class="text-xs font-bold">Deny</span>
                            </button>
                            <button onclick="showView('forward')"
                                class="flex flex-col items-center justify-center gap-1 p-3 rounded-xl border border-blue-100 bg-blue-50 text-blue-700 hover:bg-blue-100 transition-all">
                                <span class="material-symbols-outlined">forward</span>
                                <span class="text-xs font-bold">Forward</span>
                            </button>
                            <button onclick="confirmAccept()"
                                class="flex flex-col items-center justify-center gap-1 p-3 rounded-xl border border-emerald-100 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 transition-all shadow-sm">
                                <span class="material-symbols-outlined">check_circle</span>
                                <span class="text-xs font-bold">Accept</span>
                            </button>
                        </div>
                    </div>

                    <!-- VIEW: DENY INPUT -->
                    <div id="view-deny" class="hidden" style="display: none;">
                        <h4 class="text-sm font-bold text-red-700 mb-3 flex items-center gap-2">
                            <span class="material-symbols-outlined text-base">block</span>
                            Deny Request
                        </h4>
                        <div class="mb-4">
                            <label for="deny-reason"
                                class="block text-xs font-semibold text-slate-500 uppercase mb-1">Reason
                                required</label>
                            <textarea id="deny-reason" rows="3"
                                class="w-full rounded-lg border-red-200 bg-red-50 focus:border-red-500 focus:ring-red-500 text-sm p-2.5 placeholder:text-red-300 transition-all outline-none"
                                placeholder="E.g. I am not in the office currently"></textarea>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="showView('default')"
                                class="flex-1 py-2.5 rounded-lg border border-slate-200 text-slate-600 text-sm font-bold hover:bg-slate-50 transition-colors">Cancel</button>
                            <button onclick="confirmDeny()"
                                class="flex-1 py-2.5 rounded-lg bg-red-600 text-white text-sm font-bold hover:bg-red-700 shadow-lg shadow-red-200 transition-all">Confirm
                                Deny</button>
                        </div>
                    </div>

                    <!-- VIEW: FORWARD INPUT -->
                    <div id="view-forward" class="hidden" style="display: none;">
                        <h4 class="text-sm font-bold text-blue-700 mb-3 flex items-center gap-2">
                            <span class="material-symbols-outlined text-base">forward</span>
                            Forward Request
                        </h4>
                        <div class="mb-4">
                            <label for="forward-select"
                                class="block text-xs font-semibold text-slate-500 uppercase mb-1">Select New
                                Host</label>
                            <div class="relative">
                                <select id="forward-select"
                                    class="w-full rounded-lg border-blue-200 bg-blue-50 focus:border-blue-500 focus:ring-blue-500 text-sm h-11 transition-all outline-none cursor-pointer">
                                    <option value="" disabled selected>Choose a colleague...</option>
                                    <!-- Options populated via JS -->
                                </select>
                            </div>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="showView('default')"
                                class="flex-1 py-2.5 rounded-lg border border-slate-200 text-slate-600 text-sm font-bold hover:bg-slate-50 transition-colors">Cancel</button>
                            <button onclick="confirmForward()"
                                class="flex-1 py-2.5 rounded-lg bg-blue-600 text-white text-sm font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all">Forward</button>
                        </div>
                    </div>

                </div>

                <!-- Footer -->
                <div class="bg-slate-50/50 px-6 py-3 border-t border-slate-100 flex justify-center">
                    <button onclick="snoozeNotification()"
                        class="text-xs font-medium text-slate-400 hover:text-slate-600 transition-colors flex items-center gap-1">
                        Ignore for now
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Global Polling Logic for Notifications ---
    let isNotificationActive = false;
    let currentVisitorId = null;
    const ignoredVisitorIds = new Set();
    let availableHosts = [];

    // Inject current user level and name from backend
    const currentUserLevel = {{ session.get('auth_level', 0) }};
    const currentUserName = "{{ session.get('user', '') }}";

    // Pre-fetch hosts (Same Level Only)
    function fetchHosts() {
        // Fetch only employees with the same auth level
        fetch(`/api/employees?role=${currentUserLevel}`)
            .then(res => res.json())
            .then(data => {
                availableHosts = data;
                populateForwardDropdown();
            })
            .catch(err => console.error("Failed to load hosts:", err));
    }

    function populateForwardDropdown() {
        const select = document.getElementById('forward-select');
        select.innerHTML = '<option value="" disabled selected>Choose a colleague...</option>';
        if (Array.isArray(availableHosts)) {
            availableHosts.forEach(host => {
                // Don't show self in forward list
                if (host.name !== currentUserName) {
                    const opt = document.createElement('option');
                    opt.value = host.name;
                    opt.textContent = host.name;
                    select.appendChild(opt);
                }
            });
        }
    }

    fetchHosts();
    setInterval(pollNotifications, 4000);

    function pollNotifications() {
        if (isNotificationActive) return;
        fetch('/api/pending_visitors')
            .then(response => response.json())
            .then(visitors => {
                if (visitors && visitors.length > 0) {
                    const visitor = visitors[0];
                    if (!ignoredVisitorIds.has(visitor.id)) {
                        showNotificationModal(visitor);
                    }
                }
            })
            .catch(() => { });
    }

    // --- Modal Logic ---

    function showNotificationModal(visitor) {
        isNotificationActive = true;
        currentVisitorId = visitor.id;

        // Populate Data
        document.getElementById('modal-visitor-name').textContent = visitor.name;
        document.getElementById('modal-visitor-reason').textContent = visitor.reason;

        // Reset View to Default
        showView('default');

        // Show Modal
        const modal = document.getElementById('custom-notification-modal');
        modal.classList.remove('hidden');
        modal.style.display = 'block';

        // Play Sound
        const audio = document.getElementById('notification-sound');
        if (audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Audio autoplay prevented:", e));
        }
    }

    function hideModal() {
        const modal = document.getElementById('custom-notification-modal');
        modal.classList.add('hidden');
        modal.style.display = 'none';

        isNotificationActive = false;
        currentVisitorId = null;
    }

    function showView(viewName) {
        // Views: 'default', 'deny', 'forward'
        const views = ['default', 'deny', 'forward'];

        views.forEach(v => {
            const el = document.getElementById(`view-${v}`);
            if (v === viewName) {
                el.classList.remove('hidden');
                el.style.display = 'block';
            } else {
                el.classList.add('hidden');
                el.style.display = 'none';
            }
        });

        // Reset inputs on view change
        if (viewName === 'default') {
            document.getElementById('deny-reason').value = '';
            document.getElementById('forward-select').selectedIndex = 0;
        }
    }

    // --- Interactions ---

    function confirmAccept() {
        if (!currentVisitorId) return;
        handleAction(currentVisitorId, 'approve');
    }

    function confirmDeny() {
        const reason = document.getElementById('deny-reason').value.trim();
        if (!reason) {
            alert("Please provide a reason for denial.");
            return;
        }
        handleAction(currentVisitorId, 'deny', reason);
    }

    function confirmForward() {
        const newHost = document.getElementById('forward-select').value;
        if (!newHost) {
            alert("Please select a colleague to forward to.");
            return;
        }
        handleAction(currentVisitorId, 'forward', null, newHost);
    }

    function snoozeNotification() {
        if (currentVisitorId) {
            ignoredVisitorIds.add(currentVisitorId);
        }
        hideModal();
    }

    function handleAction(visitorId, action, reason = null, details = null) {
        const payload = {
            visitor_id: visitorId,
            action: action,
            reason: reason,
            details: details
        };

        fetch('/api/action_visitor', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
            .then(res => res.json())
            .then(data => {
                hideModal();
                if (data.success) {
                    if (action === 'forward') ignoredVisitorIds.add(visitorId);
                    window.dispatchEvent(new CustomEvent('notification-action-complete'));
                } else {
                    alert("Error: " + (data.error || "Unknown error"));
                }
            })
            .catch(() => {
                hideModal();
                alert("Network error.");
            });
    }
</script>
