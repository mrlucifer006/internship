<!-- Notification System (Native Dialogs & Polling) -->
<!-- Notification Sound -->
<audio id="notification-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"
    preload="auto"></audio>

<script>
    // --- Global Polling Logic for Notifications ---
    let isNotificationActive = false; // Prevent multiple dialogs if poll fires again
    const ignoredVisitorIds = new Set(); // Store IDs of visitors we've "Snoozed" (Cancelled prompt)

    function pollNotifications() {
        if (isNotificationActive) return;

        fetch('/api/pending_visitors')
            .then(response => response.json())
            .then(visitors => {
                if (visitors && visitors.length > 0) {
                    const visitor = visitors[0];
                    // Only show if NOT in ignore list
                    if (!ignoredVisitorIds.has(visitor.id)) {
                        handleNotification(visitor.name, visitor.reason, visitor.id);
                    }
                }
            })
            .catch(err => {
                // Silent fail
            });
    }

    function handleNotification(name, reason, id) {
        isNotificationActive = true;

        // Play Sound (Frontend - works if tab active)
        const audio = document.getElementById('notification-sound');
        if (audio) {
            audio.play().catch(e => console.log("Audio autoplay prevented:", e));
        }

        // Small timeout to allow sound to start before blocking thread
        setTimeout(() => {
            const message = `Visitor Request:\n\nName: ${name}\nReason: ${reason}\n\nClick OK to ACCEPT.\nClick Cancel to DENY.`;

            if (confirm(message)) {
                // User clicked OK -> Accept
                handleAction(id, 'approve');
            } else {
                // User clicked Cancel -> Deny Logic
                promptDenial(id);
            }
        }, 100);
    }

    function promptDenial(id) {
        const denialReason = prompt("You have chosen to DENY this visitor.\n\nPlease enter a reason:\n(Click Cancel to Ignore/Snooze this request)");

        if (denialReason !== null) {
            // User entered text (or empty) and clicked OK
            if (!denialReason.trim()) {
                alert("Denial cancelled: A reason is required.");
                // Add to ignore list to prevent immediate re-pop
                ignoredVisitorIds.add(id);
                isNotificationActive = false;
            } else {
                handleAction(id, 'deny', denialReason);
            }
        } else {
            // User clicked Cancel on the PROMPT -> They just want to close the dialog
            // Add to ignore list so we don't annoy them instantly
            console.log("Notification snoozed for visitor ID:", id);
            ignoredVisitorIds.add(id);
            isNotificationActive = false;
        }
    }

    function handleAction(visitorId, action, reason = "") {
        fetch('/api/action_visitor', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ visitor_id: visitorId, action: action, reason: reason })
        })
            .then(res => res.json())
            .then(data => {
                isNotificationActive = false;
                if (data.success) {
                    // Trigger global update immediately
                    window.dispatchEvent(new CustomEvent('notification-action-complete'));
                } else {
                    alert("Error processing action: " + data.error);
                }
            })
            .catch(err => {
                console.error(err);
                isNotificationActive = false;
            });
    }

    // Poll every 4 seconds
    setInterval(pollNotifications, 4000);
</script>
